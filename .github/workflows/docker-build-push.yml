name: Build And Push Images

on:
  push:
    branches:
      - main
    # Don't rebuild/push all microservice images for changes that touch no
    # service code — Helm charts, Terraform, docs, DB init, and infra-only
    # workflows. A push that also touches service code still triggers a build.
    paths-ignore:
      - "helm/**"
      - "terraform/**"
      - "docs/**"
      - "mysql-init/**"
      - "postgres-init/**"
      - "scripts/**"
      - "**.md"
      - "docker-compose.yml"
      - ".github/workflows/helm-deploy.yml"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  REGISTRY_REPOSITORY: hendafarhani-microgo-registry

jobs:
  # Figure out which services actually need rebuilding for this push, so a
  # one-line change in a single service no longer rebuilds all of them.
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # NOTE: the services are git submodules (see .gitmodules), so a service
          # update lands as a *gitlink bump* -- the push diff shows the bare path
          # (e.g. `gateway`), NOT files under `gateway/`. Each filter therefore
          # matches BOTH the bare submodule path and `<svc>/**` (the latter is
          # future-proofing for any in-repo files); a `<svc>/**`-only filter would
          # never match a pointer bump and the service would silently never build.
          #
          # DRY-RUN REMINDER: path-filter behavior against submodule bumps can't be
          # proven without an actual run. When changing these filters, verify on a
          # throwaway branch that (a) bumping one submodule builds only that service
          # and (b) a `shared` change (root pom.xml) rebuilds all 10.
          filters: |
            # Shared build inputs: the parent POM, this workflow, and the submodule
            # map all affect every image, so a change here forces a full rebuild.
            shared:
              - 'pom.xml'
              - '.github/workflows/docker-build-push.yml'
              - '.gitmodules'
            centralized-config: ['centralized-config', 'centralized-config/**']
            dashboard-service: ['dashboard-service', 'dashboard-service/**']
            discovery: ['discovery', 'discovery/**']
            driver-location-generator: ['driver-location-generator', 'driver-location-generator/**']
            driver-location-streamer: ['driver-location-streamer', 'driver-location-streamer/**']
            gateway: ['gateway', 'gateway/**']
            location-saver: ['location-saver', 'location-saver/**']
            outbox-publisher-service: ['outbox-publisher-service', 'outbox-publisher-service/**']
            ride-request: ['ride-request', 'ride-request/**']
            simulation-service: ['simulation-service', 'simulation-service/**']

      - name: Select services to build
        id: select
        env:
          # Full deployable set (mirrors the build matrix; excludes optimization-service).
          ALL_SERVICES: >-
            centralized-config dashboard-service discovery
            driver-location-generator driver-location-streamer gateway
            location-saver outbox-publisher-service ride-request
            simulation-service
          # JSON array of filter keys that matched (always valid JSON, "[]" if none).
          MATCHED: ${{ steps.filter.outputs.changes }}
          SHARED: ${{ steps.filter.outputs.shared }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Manual runs, or changes to shared files (parent POM / this workflow),
          # rebuild everything. Otherwise build only the services that changed.
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$SHARED" = "true" ]; then
            services=$(printf '%s\n' $ALL_SERVICES | jq -R . | jq -cs .)
          else
            # Drop the "shared" sentinel; keep the changed service keys.
            services=$(printf '%s' "$MATCHED" | jq -c 'map(select(. != "shared"))')
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Services to build: $services"

  docker:
    needs: detect
    # Skip cleanly when nothing service-related changed (empty matrix).
    if: ${{ needs.detect.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build application jar
        working-directory: ${{ matrix.service }}
        run: mvn -B clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DOCR_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push image
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64
          # :latest is a moving pointer for humans; the :<git-sha> tag is immutable
          # and is what the deploy pins to for reproducible re-runs.
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_REPOSITORY }}/microgo-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.REGISTRY_REPOSITORY }}/microgo-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}
          provenance: false
          sbom: false

      - name: Save image digest map
        run: |
          mkdir -p digest-map
          cat > digest-map/${{ matrix.service }}.txt <<EOF
          service=${{ matrix.service }}
          image=${{ env.REGISTRY }}/${{ env.REGISTRY_REPOSITORY }}/microgo-${{ matrix.service }}:latest
          digest=${{ steps.build_image.outputs.digest }}
          git_sha=${{ github.sha }}
          run_id=${{ github.run_id }}
          EOF

      - name: Upload digest map artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-map-${{ matrix.service }}
          path: digest-map/${{ matrix.service }}.txt
