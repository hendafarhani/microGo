name: Reusable Maven Build

on:
  workflow_call:
    inputs:
      java_version:
        required: true
        type: string
      maven_goal:
        required: false
        type: string
        default: verify

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Maven build
        run: mvn -B ${{ inputs.maven_goal }}

      # Integration tests use @Testcontainers(disabledWithoutDocker = true), which
      # silently self-skips when no Docker daemon is present. That is fine locally,
      # but in the pipeline a skipped integration test must fail the build so a
      # missing Docker daemon can never let a green `verify` hide untested code.
      - name: Fail if integration tests were skipped in CI
        if: ${{ contains(inputs.maven_goal, 'verify') || contains(inputs.maven_goal, 'integration-test') }}
        shell: bash
        run: |
          summaries=$(find . -path '*/target/failsafe-reports/failsafe-summary.xml' 2>/dev/null | sort)
          if [ -z "$summaries" ]; then
            echo "No Failsafe summary found - this module has no integration tests. Nothing to enforce."
            exit 0
          fi
          rc=0
          while IFS= read -r f; do
            skipped=$(sed -n 's:.*<skipped>\([0-9]\+\)</skipped>.*:\1:p' "$f" | head -n1)
            completed=$(sed -n 's:.*<completed>\([0-9]\+\)</completed>.*:\1:p' "$f" | head -n1)
            if [ -z "$skipped" ] || [ -z "$completed" ]; then
              echo "::error file=$f::Unable to parse <completed>/<skipped> counts from failsafe-summary.xml"
              rc=1
              continue
            fi
            echo "$f -> completed=$completed skipped=$skipped"
            if [ "$skipped" -gt 0 ]; then
              echo "::error file=$f::$skipped integration test(s) were SKIPPED in CI. Testcontainers ITs must run in the pipeline - ensure the Docker daemon is available on the runner."
              rc=1
            fi
          done <<< "$summaries"
          exit $rc
