name: Deploy Helm Charts

# Manual deploy of the microservice Helm charts to the DigitalOcean cluster.
# Deployable set = all services except optimization-service (mirrors the build matrix).
#
# Startup ordering (config -> discovery -> gateway) is enforced at RUNTIME by the
# wait-for init containers baked into the charts, so the services can be deployed
# in parallel here: gateway's pod will sit in Init until discovery is reachable,
# discovery until centralized-config is reachable, etc.
#
# Chart.lock is intentionally NOT committed (see .gitignore). `helm dependency build`
# on Helm 4 regenerates it in the runner and vendors the `common` library chart.
#
# Required repository secrets:
#   DIGITALOCEAN_ACCESS_TOKEN - DO API token with Kubernetes + registry read access
#                               (may be the same full-scope token used for DOCR_TOKEN)

on:
  # Manual only. Deploys never run on their own: once the cluster is up, pods and
  # deployments change only when this job is triggered by hand (Run workflow), so
  # there is no automatic redeploy/drift on pushes to main.
  workflow_dispatch:
    inputs:
      environment:
        description: Values overlay to apply (values-<env>.yaml)
        type: choice
        options:
          - dev
          - prod
        default: dev
      cluster_name:
        description: DigitalOcean Kubernetes cluster name
        type: string
        default: microgo-dev
      namespace:
        description: Kubernetes namespace to deploy into
        type: string
        default: microgo-dev
      image_tag:
        description: Immutable image tag to deploy (leave blank to deploy HEAD's code state — the nearest ancestor commit that has images)
        type: string
        default: ""

env:
  HELM_VERSION: v4.2.3
  ENVIRONMENT: ${{ inputs.environment }}
  CLUSTER_NAME: ${{ inputs.cluster_name }}
  NAMESPACE: ${{ inputs.namespace }}
  # The explicit tag to deploy, or empty. A blank tag is resolved per-service in
  # the "Resolve image digest" step below: it walks main's history from HEAD and
  # picks the nearest ancestor commit that actually has an image. Infra-only
  # commits (Helm/Terraform/docs) skip the image build, so HEAD itself often has
  # no image; its code state is identical to the last built ancestor, whose image
  # is therefore the correct one to deploy. Re-running redeploys the same images.
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - centralized-config
          - dashboard-service
          - discovery
          - driver-location-generator
          - driver-location-streamer
          - gateway
          - location-saver
          - outbox-publisher-service
          - ride-request
          - simulation-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history so a blank image_tag can walk back from HEAD to the
          # nearest ancestor commit that has images (infra-only commits on top
          # of HEAD carry no image but don't change service code).
          fetch-depth: 0

      - name: Install Helm (pinned)
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubeconfig for the cluster
        run: doctl kubernetes cluster kubeconfig save "${{ env.CLUSTER_NAME }}"

      - name: Resolve image digest (verifies the image exists)
        # Resolve the tag to deploy and read its immutable manifest digest.
        #  - Explicit image_tag: look it up and fail fast if it isn't there.
        #  - Blank image_tag: walk main's history from HEAD and pick the nearest
        #    ancestor commit whose image exists in this service's repo. This keeps
        #    the deploy working after infra-only merges (which skip the image
        #    build) without silently deploying a moved tag.
        # Either way, a missing image fails here with a clear message instead of
        # letting pods land in ImagePullBackOff on the cluster.
        run: |
          # pipefail: a doctl auth/network failure must surface as a real error,
          # not get masked by a downstream awk and misreported as "image not found".
          set -euo pipefail
          repo="microgo-${{ matrix.service }}"

          # Pull this repo's tags once; look up a digest by exact tag match.
          tags="$(doctl registry repository list-tags "$repo" \
            --format Tag,ManifestDigest --no-header)"
          digest_for() { awk -v t="$1" '$1 == t { print $2 }' <<< "$tags"; }

          explicit="${{ env.IMAGE_TAG }}"
          if [ -n "$explicit" ]; then
            tag="$explicit"
            digest="$(digest_for "$tag")"
            if [ -z "$digest" ]; then
              echo "::error::Image $repo:$tag not found in registry."
              exit 1
            fi
          else
            # Nearest built ancestor: git rev-list yields HEAD-first, so the first
            # commit with an image is the closest one.
            tag=""
            digest=""
            for sha in $(git rev-list HEAD); do
              d="$(digest_for "$sha")"
              if [ -n "$d" ]; then
                tag="$sha"
                digest="$d"
                break
              fi
            done
            if [ -z "$digest" ]; then
              echo "::error::No image found in $repo for HEAD or any ancestor commit. Has any build finished?"
              exit 1
            fi
            if [ "$tag" != "${{ github.sha }}" ]; then
              echo "::notice::HEAD (${{ github.sha }}) has no image in $repo; deploying nearest built ancestor $tag."
            fi
          fi

          echo "Resolved $repo:$tag -> $digest"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Build chart dependencies
        # Regenerates Chart.lock (gitignored) and vendors ../common into charts/.
        # On Helm 4 this works whether or not a lock file exists.
        run: helm dependency build "helm/${{ matrix.service }}"

      - name: Deploy ${{ matrix.service }}
        # No `--wait` here: matrix jobs deploy in parallel, and a service's pod may
        # sit in Init until a sibling release (e.g. discovery for gateway) is applied.
        # Applying all releases first lets the wait-for init containers resolve; the
        # rollout-status step below is the real readiness gate.
        # Pin by digest (repo@sha256:...) so the running pod is cryptographically tied
        # to one image, immune to a :latest or :<sha> tag being moved later.
        run: |
          helm upgrade --install "${{ matrix.service }}" "helm/${{ matrix.service }}" \
            --namespace "${{ env.NAMESPACE }}" \
            --create-namespace \
            --set namespace.name="${{ env.NAMESPACE }}" \
            --set component.image.digest="${{ env.IMAGE_DIGEST }}" \
            --values "helm/${{ matrix.service }}/values-${{ env.ENVIRONMENT }}.yaml"

      - name: Wait for rollout
        run: kubectl -n "${{ env.NAMESPACE }}" rollout status "deployment/${{ matrix.service }}" --timeout=10m
