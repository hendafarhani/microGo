fullnameOverride: simulation-service

namespace:
  name: microgo-dev

global:
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

component:
  name: simulation-service
  fullnameOverride: simulation-service
  replicaCount: 1
  waitFor:
    - { name: config, host: centralized-config, port: 8080 }
  containerPort: 8089
  image:
    repository: registry.digitalocean.com/hendafarhani-microgo-registry/microgo-simulation-service
    tag: latest
  service:
    enabled: true
    type: ClusterIP
    port: 8089
    targetPort: 8089
  configMap:
    enabled: true
    data:
      SPRING_CLOUD_CONFIG_URI: http://centralized-config:8080
      SPRING_CLOUD_CONFIG_NAME: simulation-service
      SPRING_CONFIG_IMPORT: optional:configserver:http://centralized-config:8080
  secret:
    enabled: false
    stringData: {}
  env:
    - name: SERVER_PORT
      value: "8089"
    - name: PORT
      value: "8089"
  readinessProbe:
    tcpSocket:
      port: 8089
    initialDelaySeconds: 20
    periodSeconds: 10
  livenessProbe:
    tcpSocket:
      port: 8089
    initialDelaySeconds: 40
    periodSeconds: 15
  resources: {}
