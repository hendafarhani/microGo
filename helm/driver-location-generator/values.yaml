fullnameOverride: driver-location-generator

namespace:
  name: microgo-dev

global:
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Image used by wait-for init containers; override to mirror into a private registry.
  busyboxImage: busybox:1.36

component:
  name: driver-location-generator
  fullnameOverride: driver-location-generator
  replicaCount: 1
  waitFor:
    - { name: config, host: centralized-config, port: 8080 }
  containerPort: 8088
  image:
    repository: registry.digitalocean.com/hendafarhani-microgo-registry/microgo-driver-location-generator
    tag: latest
  service:
    enabled: true
    type: ClusterIP
    port: 8088
    targetPort: 8088
  configMap:
    enabled: true
    data:
      SPRING_CLOUD_CONFIG_URI: http://centralized-config:8080
      SPRING_CLOUD_CONFIG_NAME: driver-location-generator
      SPRING_CONFIG_IMPORT: configserver:http://centralized-config:8080
  secret:
    enabled: false
    stringData: {}
  env:
    - name: SERVER_PORT
      value: "8088"
    - name: PORT
      value: "8088"
  readinessProbe:
    tcpSocket:
      port: 8088
    initialDelaySeconds: 20
    periodSeconds: 10
  livenessProbe:
    tcpSocket:
      port: 8088
    initialDelaySeconds: 40
    periodSeconds: 15
  resources: {}
