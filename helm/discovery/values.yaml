fullnameOverride: discovery

namespace:
  name: microgo-dev

global:
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Image used by wait-for init containers; override to mirror into a private registry.
  busyboxImage: busybox:1.36

component:
  name: discovery
  fullnameOverride: discovery
  replicaCount: 1
  # No waitFor: discovery is the Eureka registry and has no config client on its
  # classpath, so it must not be gated behind centralized-config.
  containerPort: 8082
  image:
    repository: registry.digitalocean.com/hendafarhani-microgo-registry/microgo-discovery
    tag: latest
  service:
    enabled: true
    type: ClusterIP
    port: 8082
    targetPort: 8082
  # No SERVER_PORT: discovery pins server.port=8082 in its own application.properties,
  # and every sibling config hardcodes http://discovery:8082/eureka. The ports below are
  # the cluster's view (what to expose and route to), not a second opinion on what to bind.
  readinessProbe:
    httpGet:
      path: /
      port: 8082
    initialDelaySeconds: 20
    periodSeconds: 10
  livenessProbe:
    tcpSocket:
      port: 8082
    initialDelaySeconds: 40
    periodSeconds: 15
  resources: {}
